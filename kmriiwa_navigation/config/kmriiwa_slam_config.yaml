# SLAM Toolbox Configuration for KMRIIWA Robot
slam_toolbox:
  ros__parameters:
    # Use real time (not simulation)
    use_sim_time: false
    
    # Frame names matching your robot setup - FIXED: use base_link not base_footprint
    odom_frame: kmriiwa_odom
    map_frame: slam_map
    base_frame: kmriiwa_base_link
    scan_topic: /kmriiwa/base/state/LaserB1Scan
    odom_topic: /kmriiwa/base/state/odom
    
    # Map parameters
    resolution: 0.05
    max_laser_range: 14.5
    minimum_time_interval: 0.5
    transform_timeout: 1.0
    tf_buffer_duration: 15.0
    
    # Motion parameters for real robot
    linear_update_distance: 0.1
    angular_update_distance: 0.1
    
    # Loop closure settings
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_search_space_dimension: 8.0
    
    # Map saving
    map_start_pose: [0.0, 0.0, 0.0]
    
    # Scan matching parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 20.0
    
    # Performance parameters
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    
    # Correlation search space
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    
    # Map update
    map_update_interval: 5.0
    
    # Publisher settings
    enable_interactive_mode: true

    # QoS settings to match your laser scanners
    qos_overrides:
      /scan_multi:
        reliability: best_effort
        durability: volatile
        history: keep_last
        depth: 10